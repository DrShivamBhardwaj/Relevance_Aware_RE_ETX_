name: Export complete project snapshot
on:
  push:
    branches: [artifact-export]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact final-main repository archive
        run: |
          git archive --format=zip --output=PROJECT_REPOSITORY_SNAPSHOT_08563b9.zip 08563b92f506f594f61d3a266a18a26bc93294ec
          sha256sum PROJECT_REPOSITORY_SNAPSHOT_08563b9.zip > PROJECT_REPOSITORY_SNAPSHOT_08563b9.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: project-repository-snapshot-08563b9-exact
          path: |
            PROJECT_REPOSITORY_SNAPSHOT_08563b9.zip
            PROJECT_REPOSITORY_SNAPSHOT_08563b9.sha256
          compression-level: 0
          retention-days: 7
